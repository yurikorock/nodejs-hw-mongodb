# swagger/paths/contacts/post.yaml
tags:
  - Contacts
summary: Create contact
operationId: craeteContact
description: 'Create a contact with payload'
security:
  - bearerAuth: []
requestBody:
  content:
    multipart/form-data:
      schema:
        type: object
        required:
          - name
          - phoneNumber
          - contactType
          - userId
        properties:
          name:
            description: "Contact's name"
            type: string
            example: 'John Doe'
          phoneNumber:
            description: "Contact's number phone"
            type: number
            example: '+380500502222'
          contactType:
            description: 'Options of contact'
            type: string
            enum: ['work', 'home', 'personal']
          userId:
            description: "Contact's id"
            type: number
            example: 687ce2d1d46860d74f96710e
responses:
  '201':
    description: 'Creates a contact'
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: Successfully created a contact!
            data:
              type: object
              $ref: '../../components/schemas/contact.yaml'
  '404':
    $ref: '../../components/responses/401.yaml'
